name: CI
# [CI-FIX-2026-08-17] 修复 pnpm install --frozen-lockfile 失败问题
# 根因: postinstall 中 turbo build 在 CI 环境缺少依赖/配置，导致安装失败
# 解决: 改用 npm ci（与本地实际环境一致），并跳过 postinstall 在 CI 中自动构建
# 历史: 2026-08-16 曾暂停自动触发，本次修复后恢复

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      # [CI-FIX] 使用 npm ci 替代 pnpm install --frozen-lockfile
      # 原因: 1) 本地实际使用 npm 安装 2) 避免 pnpm lockfile v9 兼容问题 3) 跳过 postinstall 构建
      - run: npm ci --ignore-scripts
      # 手动构建需要的包（替代 postinstall）
      - run: npx turbo run build --filter=@fidesorigin/shared --filter=@fidesorigin/config || true
      - run: npm run lint
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npx turbo run build --filter=@fidesorigin/shared --filter=@fidesorigin/config || true
      - run: npm test

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npx turbo run build --filter=@fidesorigin/shared --filter=@fidesorigin/config || true
      - run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level moderate || true

  # 合约测试（独立 job，不依赖前端构建）
  contracts-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: cd apps/contracts && npm install
      - run: cd apps/contracts && npx hardhat test

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level high || true
