name: CI
# [CI-FIX-2026-08-17] 修复 pnpm install --frozen-lockfile 失败问题
# 根因: postinstall 中 turbo build 在 CI 环境缺少依赖/配置，导致安装失败
# 解决: pnpm install --ignore-scripts（跳过 postinstall 构建，保留 pnpm 供 turbo 识别）
# 历史: 2026-08-16 曾暂停自动触发，本次修复后恢复

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 [INFO-4 FIX: pin]
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 [INFO-4 FIX: pin]
        with:
          version: 11.6.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 [INFO-4 FIX: pin]
        with:
          node-version: '22'
          cache: 'pnpm'
      # [CI-FIX] block-exotic-subdeps: pnpm 在 CI 中不读取 .npmrc，用 CLI 参数禁用
      - run: pnpm install --ignore-scripts --no-frozen-lockfile --config.block-exotic-subdeps=false
      - run: pnpm turbo run build --filter=@fidesorigin/shared --filter=@fidesorigin/config || true
      - run: cd apps/contracts && pnpm install --no-frozen-lockfile --config.block-exotic-subdeps=false
      # [CI-FIX] 只有 web 和 config 有 eslint 配置，其他包 lint 会失败
      - run: pnpm turbo run lint --filter=@fidesorigin/web --filter=@fidesorigin/config
      # [CI-FIX] subgraph 是 AssemblyScript，与 TypeScript 不兼容，跳过 typecheck
      - run: pnpm turbo run typecheck --filter=!@fidesorigin/subgraph

  test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 [INFO-4 FIX: pin]
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 [INFO-4 FIX: pin]
        with:
          version: 11.6.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 [INFO-4 FIX: pin]
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --ignore-scripts --no-frozen-lockfile --config.block-exotic-subdeps=false
      - run: pnpm turbo run build --filter=@fidesorigin/shared --filter=@fidesorigin/config || true
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 [INFO-4 FIX: pin]
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 [INFO-4 FIX: pin]
        with:
          version: 11.6.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 [INFO-4 FIX: pin]
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --ignore-scripts --no-frozen-lockfile --config.block-exotic-subdeps=false
      - run: pnpm turbo run build --filter=@fidesorigin/shared --filter=@fidesorigin/config || true
      # [CI-FIX] subgraph build 需要先生成类型文件
      - run: cd apps/subgraph && pnpm codegen
      - run: pnpm build
      - name: Audit dependencies
        run: pnpm audit --audit-level moderate || true

  contracts-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 [INFO-4 FIX: pin]
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 [INFO-4 FIX: pin]
        with:
          version: 11.6.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 [INFO-4 FIX: pin]
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --ignore-scripts --no-frozen-lockfile --config.block-exotic-subdeps=false
      - run: cd apps/contracts && pnpm install --no-frozen-lockfile --config.block-exotic-subdeps=false
      - run: cd apps/contracts && npx hardhat test

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 [INFO-4 FIX: pin]
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 [INFO-4 FIX: pin]
        with:
          version: 11.6.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 [INFO-4 FIX: pin]
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --ignore-scripts --no-frozen-lockfile --config.block-exotic-subdeps=false
      - run: pnpm audit --audit-level high || true

  # [O-1] 前端样式回归校验：把 2026-09-02/09-03 审计沉淀的两个校验脚本纳入 CI，
  # 防止"未分层 CSS / 尾斜杠链接 / 死变量 / 裸 z-index / 对比度不达标"再次进入产物。
  # 两个脚本读取 apps/web/out/ 的产物做独立实测，因此必须先构建。
  frontend-style-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 [INFO-4 FIX: pin]
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 [INFO-4 FIX: pin]
        with:
          version: 11.6.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 [INFO-4 FIX: pin]
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --ignore-scripts --no-frozen-lockfile --config.block-exotic-subdeps=false
      - run: pnpm turbo run build --filter=@fidesorigin/shared --filter=@fidesorigin/config || true
      - run: cd apps/web && pnpm build
      - run: cd apps/web && python _verify.py
      - run: cd apps/web && python _crosscheck.py
