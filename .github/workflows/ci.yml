name: CI

# [2026-08-16] 暂停自动触发：pnpm install --frozen-lockfile 持续失败（疑似 postinstall 构建 shared/config 包在 CI 环境失败）。
# 修复后恢复 push/pull_request 触发。手动跑：Actions → CI → Run workflow。
# 注：后端/合约质量门已由 backend-test.yml(pytest) 和 contracts-test.yml(hardhat) 接管（ruleset main-ci-gate 必过检查）。
on:
  workflow_dispatch:

# [High Fix #54] Explicit least-privilege permissions for CI/CD workflows.
permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results/
            junit.xml
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # [LOW-25 FIX] Dependency vulnerability scan
      - name: Audit dependencies
        run: pnpm audit --audit-level moderate
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            apps/web/dist
            apps/web/.next
          retention-days: 7

  # [LOW-25 FIX] Security scanning job
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # npm audit for known vulnerabilities
      - name: Run npm audit
        run: pnpm audit --audit-level high
      # Solidity static analysis (if Slither is available)
      - name: Install Slither
        run: |
          python3 -m pip install --upgrade pip
          pip install slither-analyzer || true
      - name: Run Slither analysis
        working-directory: apps/contracts
        run: |
          if command -v slither &> /dev/null; then
            slither . --config-file slither.config.json --sarif slither.sarif
          else
            echo "Slither not available, skipping Solidity analysis"
            exit 0
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-results
          path: |
            apps/contracts/slither.sarif
            pnpm-audit.json
          retention-days: 7
