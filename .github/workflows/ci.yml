name: CI
# [CI-FIX-2026-08-17] 修复 pnpm install --frozen-lockfile 失败问题
# 根因: postinstall 中 turbo build 在 CI 环境缺少依赖/配置，导致安装失败
# 解决: pnpm install --ignore-scripts（跳过 postinstall 构建，保留 pnpm 供 turbo 识别）
# 历史: 2026-08-16 曾暂停自动触发，本次修复后恢复

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# [CI-FIX] job 级别环境变量，确保所有子进程继承
env:
  ESLINT_USE_FLAT_CONFIG: "false"
  npm_config_block_exotic_subdeps: "false"

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --ignore-scripts --no-frozen-lockfile
      - run: pnpm turbo run build --filter=@fidesorigin/shared --filter=@fidesorigin/config || true
      - run: cd apps/contracts && pnpm install --no-frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --ignore-scripts --no-frozen-lockfile
      - run: pnpm turbo run build --filter=@fidesorigin/shared --filter=@fidesorigin/config || true
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --ignore-scripts --no-frozen-lockfile
      - run: pnpm turbo run build --filter=@fidesorigin/shared --filter=@fidesorigin/config || true
      - run: pnpm build
      - name: Audit dependencies
        run: pnpm audit --audit-level moderate || true

  contracts-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --ignore-scripts --no-frozen-lockfile
      - run: cd apps/contracts && pnpm install --no-frozen-lockfile
      - run: cd apps/contracts && npx hardhat test

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --ignore-scripts --no-frozen-lockfile
      - run: pnpm audit --audit-level high || true
