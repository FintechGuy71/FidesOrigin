name: Contracts Tests

on:
  push:
    branches: [main]
    paths:
      - 'apps/contracts/**'
      - 'apps/subgraph/**'
      - '.github/workflows/contracts-test.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardhat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 [INFO-4 FIX: pin]

      # [CI-FIX] 项目用 pnpm，改用 pnpm 安装避免 npm ci lockfile 不同步
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 [INFO-4 FIX: pin]
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 [INFO-4 FIX: pin]
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        working-directory: apps/contracts
        # [CI-FIX] block-exotic-subdeps + ignore-scripts 避免 postinstall 构建卡住
        run: pnpm install --ignore-scripts --no-frozen-lockfile --config.block-exotic-subdeps=false

      - name: Compile contracts
        working-directory: apps/contracts
        run: npx hardhat compile

      - name: Run contract tests
        id: tests
        working-directory: apps/contracts
        run: |
          npx hardhat test 2>&1 | tee hardhat-test.log
          exit ${PIPESTATUS[0]}

      - name: Report failures as annotations
        if: failure()
        working-directory: apps/contracts
        run: |
          grep -E "^\s+[0-9]+\) |Error:|AssertionError|reverted" hardhat-test.log | head -20 | while IFS= read -r line; do echo "::error::${line:0:300}"; done

  # [T-1 FIX] subgraph mapping 测试（matchstick 仅支持 linux/macOS，必须在 CI 跑）
  subgraph:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 [INFO-4 FIX: pin]

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 [INFO-4 FIX: pin]
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: apps/subgraph
        run: npm ci --ignore-scripts

      - name: Codegen
        working-directory: apps/subgraph
        run: npx graph codegen

      - name: Run subgraph tests
        working-directory: apps/subgraph
        run: npx graph test
