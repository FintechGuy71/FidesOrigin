name: Contracts Tests

on:
  push:
    branches: [main]
    paths:
      - 'apps/contracts/**'
      - '.github/workflows/contracts-test.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardhat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # [CI-FIX] 项目用 pnpm，改用 pnpm 安装避免 npm ci lockfile 不同步
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        working-directory: apps/contracts
        # [CI-FIX] block-exotic-subdeps: pnpm 在 CI 中不读取 .npmrc
        run: pnpm install --no-frozen-lockfile --config.block-exotic-subdeps=false

      - name: Compile contracts
        working-directory: apps/contracts
        run: npx hardhat compile

      - name: Run contract tests
        id: tests
        working-directory: apps/contracts
        run: |
          npx hardhat test 2>&1 | tee hardhat-test.log
          exit ${PIPESTATUS[0]}

      - name: Report failures as annotations
        if: failure()
        working-directory: apps/contracts
        run: |
          grep -E "^\s+[0-9]+\) |Error:|AssertionError|reverted" hardhat-test.log | head -20 | while IFS= read -r line; do echo "::error::${line:0:300}"; done
