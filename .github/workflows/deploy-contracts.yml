name: Deploy Contracts

on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Target network'
        required: true
        type: choice
        options:
          - sepolia
          - base-sepolia
          - mainnet
      confirm:
        description: 'Type DEPLOY to confirm'
        required: true

# [High Fix #54] Explicit least-privilege permissions for CI/CD workflows.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 [INFO-4 FIX: pin]

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 [INFO-4 FIX: pin]
        with:
          node-version: '22'

      - name: Install dependencies
        run: cd apps/contracts && npm ci

      - name: Compile contracts
        run: cd apps/contracts && npx hardhat compile

      - name: Run tests
        run: cd apps/contracts && npx hardhat test

      # [SECURITY] 密钥仅作用于 Deploy 单个步骤，绝不提升到 job 级 env。
      # [CI-FIX-2026-08-23] 环境变量名与 hardhat.config.js 对齐：
      #   配置读取 ADMIN_PRIVATE_KEY（经 HIGH-9 校验）与 SEPOLIA_RPC（缺省用公共 RPC），
      #   原来的 PRIVATE_KEY/ALCHEMY_API_KEY 根本没被配置读取，部署必然失败。
      - name: Deploy
        if: github.event.inputs.confirm == 'DEPLOY'
        env:
          ADMIN_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          SEPOLIA_RPC: ${{ secrets.SEPOLIA_RPC }}
        run: |
          cd apps/contracts
          npx hardhat run scripts/deploy-full.js --network ${{ github.event.inputs.network }}

      # [CI-FIX-2026-08-23] Etherscan 验证为增强步骤：ETHERSCAN_API_KEY 未配置或
      # hardhat.config 无 etherscan 段时不应让整个部署工作流显示失败（部署已成功）。
      - name: Verify on Etherscan
        if: success()
        continue-on-error: true
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          cd apps/contracts
          npx hardhat verify --network ${{ github.event.inputs.network }} --list

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 [INFO-4 FIX: pin]
        with:
          name: deployment-${{ github.event.inputs.network }}
          path: apps/contracts/deployments/
          retention-days: 7
