name: Deploy Subgraph

on:
  push:
    branches: [main]
    paths:
      - 'apps/subgraph/**'
      - '.github/workflows/deploy-subgraph.yml'
      # 工作流在仓库根执行 pnpm install，锁文件变更同样影响其安装结果
      - 'pnpm-lock.yaml'

# [High Fix #54] Explicit least-privilege permissions for CI/CD workflows.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 [INFO-4 FIX: pin]
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 [INFO-4 FIX: pin]
        with:
          # [Medium Fix #60] Pinned pnpm version for consistency across all workflows.
          version: 11.6.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 [INFO-4 FIX: pin]
        with:
          node-version: '22'
          cache: 'pnpm'
      # [CI-FIX-2026-08-23] 与 ci.yml 2026-08-17 修复对齐：根 postinstall 的
      # turbo build 在 CI 环境会挂起（见 ci.yml 头部注释与 deploy.yml 的同类规避），
      # 必须 --ignore-scripts 跳过。subgraph 仅依赖 graph-cli/graph-ts，
      # 不依赖 turbo 预构建的 @fidesorigin/shared 与 @fidesorigin/config。
      # pnpm-lock.yaml 已于 v3.1.0 后重新生成并同步，--frozen-lockfile 可通过。
      - run: pnpm install --ignore-scripts --frozen-lockfile
      - name: Generate Subgraph Code
        run: pnpm --filter=subgraph codegen
      - name: Build Subgraph
        run: pnpm --filter=subgraph build
      - name: Deploy to The Graph Studio
        # [CI-FIX-2026-08-23] 必须显式 run：`pnpm --filter=x deploy` 会命中 pnpm
        # 内置的 deploy 命令（ERR_PNPM_INVALID_DEPLOY_TARGET），而非包脚本。
        run: pnpm --filter=subgraph run deploy
        env:
          SUBGRAPH_ACCESS_TOKEN: ${{ secrets.SUBGRAPH_ACCESS_TOKEN }}
