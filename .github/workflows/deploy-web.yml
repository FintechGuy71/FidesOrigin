name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/deploy-web.yml'

# [High Fix #54] Explicit least-privilege permissions for CI/CD workflows.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # [Medium Fix #60] Pinned pnpm version for consistency across all workflows.
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      # [K3-Audit Fix] Secret scanning with TruffleHog
      - name: Secret Scan
        uses: trufflesecurity/trufflehog@v3.95.9
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified
      - run: pnpm install --frozen-lockfile
      # Build Next.js app to update dist/ static files from source
      - run: pnpm build --filter=web
      # Copy dist static files to Vercel output for static deployment
      - run: |
          rm -rf .vercel/output
          mkdir -p .vercel/output/static
          cp -r apps/web/dist/* .vercel/output/static/
          echo '{"version":3}' > .vercel/output/config.json
      - name: Deploy to Vercel (static)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install -g vercel@latest
          vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
