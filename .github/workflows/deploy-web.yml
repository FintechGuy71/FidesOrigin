name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/deploy-web.yml'

# [High Fix #54] Explicit least-privilege permissions for CI/CD workflows.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # [Medium Fix #60] Pinned pnpm version for consistency across all workflows.
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      # [K3-Audit Fix] Secret scanning with TruffleHog (pinned to commit SHA)
      - name: Secret Scan
        uses: trufflesecurity/trufflehog@7e78ca385fb82c19568ee7be322a41e8b0875c0b  # v3.81.1
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --filter=web
      - name: Deploy to Vercel
        run: |
          npm install -g vercel@latest
          vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
