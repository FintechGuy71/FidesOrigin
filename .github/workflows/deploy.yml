name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pure static upload of repo-root public/ via Build Output API v3.
      # No install / no build steps at all: the site is pre-built static HTML,
      # and postinstall (turbo build) hangs Vercel server-side builds.
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install -g vercel@latest
          vercel link --yes --project fidesorigin-demo --scope fintechguy71s-projects --token="$VERCEL_TOKEN"
          rm -rf .vercel/output
          mkdir -p .vercel/output/static
          cp -r public/. .vercel/output/static/
          printf '{"version":3}' > .vercel/output/config.json
          vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
