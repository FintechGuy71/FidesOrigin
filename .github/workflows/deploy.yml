name: Deploy to Vercel

on:
  push:
    branches: [main, master]
  # [M-10 Fix] PR should NOT trigger production deploy — remove pull_request trigger

# [High Fix #54] Explicit least-privilege permissions for CI/CD workflows.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4  # [Medium Fix #60] Consistent action version
        with:
          version: 11.6.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build web app
        run: cd apps/web && pnpm run build

      # [M-10 Fix] Use official Vercel CLI instead of non-official third-party action
      # Install Vercel CLI globally and deploy with official vercel/vercel CLI
      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          cd apps/web
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

  # [K3-Audit Fix] Pin image digest in K8s deployment manifest before deploy.
  deploy-k8s:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Pin image digest
        run: |
          # Pull the image to get its digest, then replace ${IMAGE_DIGEST} in deployment.yaml
          docker pull fidesorigin/data-publisher:latest
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' fidesorigin/data-publisher:latest | cut -d'@' -f2)
          sed -i "s|\\${IMAGE_DIGEST}|${DIGEST#sha256:}|g" k8s/deployment.yaml
          echo "Pinned digest: ${DIGEST}"
          cat k8s/deployment.yaml | grep "image:"
