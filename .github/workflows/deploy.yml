name: Deploy to Vercel

on:
  push:
    branches: [main, master]
  # [M-10 Fix] PR should NOT trigger production deploy — remove pull_request trigger

# [High Fix #54] Explicit least-privilege permissions for CI/CD workflows.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # [Medium Fix #60] Consistent action version
        with:
          version: 11.6.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build web app
        run: cd apps/web && pnpm run build

      # Build locally and deploy prebuilt output. Server-side builds only receive
      # apps/web (342 files), so tsconfig extends of monorepo root files fails
      # with TS5083 Cannot read file '/tsconfig.json'.
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install -g vercel@latest
          cd apps/web
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"

  # [K3-Audit Fix] Build image with immutable git-sha tag, pin digest, deploy to K8s.
  deploy-k8s:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.ref == 'refs/heads/main'
    environment: production-k8s
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}/data-publisher
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push with git-sha tag (immutable). Digest is captured for K8s pinning.
      - name: Get base image digest
        id: base-digest
        run: |
          docker pull node:20-alpine
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' node:20-alpine | cut -d'@' -f2)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Base image digest: ${DIGEST}"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # [HIGH Fix] Pin base image digest for supply-chain security
          build-args: |
            BASE_IMAGE=node:20-alpine@sha256:${{ steps.base-digest.outputs.digest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get image digest
        id: digest
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} | cut -d'@' -f2)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pinned digest: ${DIGEST}"

      - name: Pin digest in K8s manifests
        run: |
          sed -i "s|sha256:\${IMAGE_DIGEST}|${{ steps.digest.outputs.digest }}|g" k8s/deployment.yaml
          sed -i "s|sha256:\${IMAGE_DIGEST}|${{ steps.digest.outputs.digest }}|g" k8s/cronjob.yaml
          # [CRITICAL Fix] Verify digest was actually replaced
          if grep -q '\${IMAGE_DIGEST}' k8s/deployment.yaml || grep -q '\${IMAGE_DIGEST}' k8s/cronjob.yaml; then
            echo "ERROR: IMAGE_DIGEST placeholder was not replaced!"
            exit 1
          fi
          echo "--- deployment.yaml ---"
          grep "image:" k8s/deployment.yaml
          echo "--- cronjob.yaml ---"
          grep "image:" k8s/cronjob.yaml

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      # KUBECONFIG secret should contain base64-encoded kubeconfig for the target cluster.
      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig.yaml
          chmod 600 kubeconfig.yaml

      - name: Apply K8s manifests
        env:
          KUBECONFIG: ${{ github.workspace }}/kubeconfig.yaml
        run: |
          set -e
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/role.yaml
          kubectl apply -f k8s/rolebinding.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/networkpolicy.yaml
          kubectl apply -f k8s/pod-disruption-budget.yaml
          # Workload manifests (depend on configs above)
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/cronjob.yaml
          # Verify deployment succeeded
          kubectl get deployment fidesorigin-data-publisher -n fidesorigin

      - name: Wait for rollout
        env:
          KUBECONFIG: ${{ github.workspace }}/kubeconfig.yaml
        run: |
          kubectl rollout status deployment/fidesorigin-data-publisher -n fidesorigin --timeout=300s

      - name: Verify CronJob
        env:
          KUBECONFIG: ${{ github.workspace }}/kubeconfig.yaml
        run: |
          kubectl get cronjob fidesorigin-batch-sync -n fidesorigin

      # [CRITICAL Fix] Always cleanup kubeconfig, even if previous steps failed
      - name: Cleanup kubeconfig
        if: always()
        run: rm -f ${{ github.workspace }}/kubeconfig.yaml
