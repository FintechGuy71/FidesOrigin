name: Production UI Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 [pin]
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 [pin]
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 [pin]
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --ignore-scripts --frozen-lockfile --config.block-exotic-subdeps=false
      - run: pnpm --filter @fidesorigin/web exec playwright install --with-deps chromium
      - name: Verify production UI and live public query
        working-directory: apps/web
        env:
          UI_BASE_URL: https://fidesorigin.com
          UI_TEST_LIVE_QUERY: 'true'
          UI_TEST_CONTACT: 'false'
        run: node scripts/verify-release-ui.mjs
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 [pin]
        with:
          name: production-ui-verification
          path: apps/web/test-results/release/
          retention-days: 7
