name: Publish On-Chain SDK to GitHub Packages

on:
  push:
    tags:
      - 'onchain-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # GitHub Packages 发布（CI 自动 GITHUB_TOKEN，零用户凭据）
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 [pin]

      - name: Verify signed tag
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          # [Fix] actions/checkout 默认把 annotated tag 剥成其指向的 commit，
          # 本地 cat-file -t 会误判为轻量标签。先显式拉取 tag 对象再判型。
          git fetch --force origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME" 2>/dev/null || true
          TAG_TYPE=$(git cat-file -t "$TAG_NAME" 2>/dev/null || echo "")
          if [ "$TAG_TYPE" != "tag" ]; then
            echo "❌ Refusal: tag '$TAG_NAME' is a lightweight tag (type=$TAG_TYPE)."
            echo "   Only annotated/signed tags are allowed for publishing."
            exit 1
          fi
          echo "✅ Verified signed/annotated tag: $TAG_NAME"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 [pin]
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@fintechguy71'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 [pin]

      - name: Install dependencies
        run: pnpm install --ignore-scripts --no-frozen-lockfile --config.blockExoticSubdeps=false

      - name: Build On-Chain SDK (tsup)
        run: pnpm --filter @fintechguy71/on-chain-sdk run build

      - name: Test On-Chain SDK
        run: pnpm --filter @fintechguy71/on-chain-sdk run test

      - name: Publish to GitHub Packages
        working-directory: packages/on-chain-sdk
        run: npm publish --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
