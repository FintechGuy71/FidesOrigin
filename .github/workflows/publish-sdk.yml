name: Publish SDK to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # [D2 Fix] 公共 npm 发布用 provenance（OIDC 可信发布）
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 [INFO-4 FIX: pin]

      - name: Verify signed tag
        run: |
          # Ensure this is a signed/annotated tag, not a lightweight tag
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          TAG_TYPE=$(git cat-file -t "$TAG_NAME" 2>/dev/null || echo "")
          if [ "$TAG_TYPE" != "tag" ]; then
            echo "❌ Refusal: tag '$TAG_NAME' is a lightweight tag (type=$TAG_TYPE)."
            echo "   Only annotated/signed tags are allowed for publishing."
            echo "   Create with: git tag -s $TAG_NAME -m 'release message'"
            exit 1
          fi
          echo "✅ Verified signed/annotated tag: $TAG_NAME"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 [INFO-4 FIX: pin]
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # [D2 Fix] monorepo：用 pnpm 安装（workspace 协议需要 pnpm），再构建 sdk。
      # shared 已 vendor 进 sdk/src/_shared.ts，sdk 源码零内部引用，产物自包含。
      - name: Setup pnpm
        uses: pnpm/action-setup@b906aff7b6bcc4f8a6ec77f1f6f2f67f10a2b0bb # v4 [INFO-4 FIX: pin]

      - name: Install dependencies
        run: pnpm install --ignore-scripts --no-frozen-lockfile --config.blockExoticSubdeps=false

      - name: Build SDK (tsup, self-contained)
        run: pnpm --filter @fintechguy71/fidesorigin-sdk run build

      - name: Publish to public npm
        working-directory: packages/sdk
        run: npm publish --access public --provenance
        env:
          # [D2 Fix] 公共 npm 需 NPM_TOKEN（在仓库 Settings → Secrets 添加，
          # 用 npm Automation token）。provenance 需 id-token: write。
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
