name: Publish SDK to GitHub Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # GitHub Packages 发布需要 packages:write（CI 自动 GITHUB_TOKEN，零用户凭据）
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 [INFO-4 FIX: pin]

      - name: Verify signed tag
        run: |
          # Ensure this is a signed/annotated tag, not a lightweight tag.
          # [Fix] actions/checkout 默认把 annotated tag 剥成其指向的 commit
          # （本地 cat-file -t 会变成 "commit" 而误判为轻量标签）。
          # 先显式拉取 tag 对象本身，再判型。
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          git fetch --force origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME" 2>/dev/null || true
          TAG_TYPE=$(git cat-file -t "$TAG_NAME" 2>/dev/null || echo "")
          if [ "$TAG_TYPE" != "tag" ]; then
            echo "❌ Refusal: tag '$TAG_NAME' is a lightweight tag (type=$TAG_TYPE)."
            echo "   Only annotated/signed tags are allowed for publishing."
            echo "   Create with: git tag -s $TAG_NAME -m 'release message'"
            exit 1
          fi
          echo "✅ Verified signed/annotated tag: $TAG_NAME"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 [INFO-4 FIX: pin]
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@fintechguy71'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 [INFO-4 FIX: pin]

      # [D2 Fix] SDK 已自包含（shared vendor 进 src/_shared.ts，零内部引用），
      # 用 pnpm 安装（monorepo 需要），tsup 构建，发 GitHub Packages。
      - name: Install dependencies
        run: pnpm install --ignore-scripts --no-frozen-lockfile --config.blockExoticSubdeps=false

      - name: Build SDK (tsup, self-contained)
        run: pnpm --filter @fintechguy71/fidesorigin-sdk run build

      - name: Publish to GitHub Packages
        working-directory: packages/sdk
        run: |
          # [Fix] 显式写 .npmrc：setup-node 的 scope registry 只配了 registry 行，
          # 未可靠注入 authToken，导致 npm publish 报 401 unauthenticated。
          # GitHub Packages 标准做法：显式 registry + _authToken 两行。
          echo "@fintechguy71:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          npm publish --access restricted
        env:
          # GitHub Packages 用 CI 自动注入的 GITHUB_TOKEN，无需用户配 npm 凭据
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
