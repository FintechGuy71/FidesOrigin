name: Secret Scan
# [CI-FIX-2026-08-17] 修复 TruffleHog base/head 引用失效问题
# 根因: base: ${{ github.event.repository.default_branch }} 在 push 事件中不可靠
# 解决: 分事件类型设置 base，push 时用 ${{ github.event.before }}，PR 时用 base branch
# 历史: 2026-08-16 曾暂停自动触发，本次修复后恢复

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # [CI-FIX] 动态计算 base ref，解决 TruffleHog base/head 引用失效
      - name: Determine base ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> $GITHUB_OUTPUT
            echo "head=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
          else
            # push 事件：用 before SHA 作为 base
            echo "base=${{ github.event.before }}" >> $GITHUB_OUTPUT
            echo "head=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Scan for secrets with TruffleHog
        uses: trufflesecurity/trufflehog@v3.95.9
        with:
          path: ./
          base: ${{ steps.base.outputs.base }}
          head: ${{ steps.base.outputs.head }}
          extra_args: --debug --only-verified

      - name: Check for .env files
        run: |
          if git ls-files | grep -E '^\.env$|^.*\.env$'; then
            echo "ERROR: .env files found in git tracking!"
            exit 1
          fi
          echo "No .env files in git tracking — OK"
