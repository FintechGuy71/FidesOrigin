name: Secret Scan

# [2026-08-16] 暂停自动触发：Scan for secrets 持续失败（疑似 TruffleHog base/head 引用在部分事件下无效）。
# 修复后恢复自动触发。手动跑：Actions → Secret Scan → Run workflow。
on:
  workflow_dispatch:

# [High Fix #54] Explicit least-privilege permissions for CI/CD workflows.
permissions:
  contents: read

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets with TruffleHog
        # [K3-Audit Fix] Pin TruffleHog to a specific release tag for supply-chain security.
        uses: trufflesecurity/trufflehog@v3.95.9
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      - name: Check for .env files
        run: |
          if git ls-files | grep -E '^\.env$|^.*\.env$'; then
            echo "ERROR: .env files found in git tracking!"
            exit 1
          fi
          echo "No .env files in git tracking — OK"
