name: Secret Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# [High Fix #54] Explicit least-privilege permissions for CI/CD workflows.
permissions:
  contents: read

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets with TruffleHog
        # [K3-Audit Fix] Pin TruffleHog to a specific commit SHA for supply-chain security.
        # Last verified: trufflesecurity/trufflehog@3b45a97 (placeholder — update to current HEAD)
        uses: trufflesecurity/trufflehog@3b45a97d73552ff24f21ff752e9a2eb7b6b49eaa
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      - name: Check for .env files
        run: |
          if git ls-files | grep -E '^\.env$|^.*\.env$'; then
            echo "ERROR: .env files found in git tracking!"
            exit 1
          fi
          echo "No .env files in git tracking — OK"
