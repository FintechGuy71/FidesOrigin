name: Visual Regression

# 视觉回归：关键页面 Playwright 截图对比。
# 基线自举：snapshots 目录不存在时，本工作流生成基线并自动回提 main（[skip ci]），
# 后续运行进入对比模式。字体渲染在 Win/Linux 有亚像素差，阈值 2% 只拦真实回归。

on:
  pull_request:
    paths: ["apps/web/**", ".github/workflows/visual-regression.yml"]
  push:
    branches: [main]
    paths: ["apps/web/**", ".github/workflows/visual-regression.yml"]
  # [v5] 有意视觉变更后手动刷新基线（避免有意变更被旧基线误判为回归）
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "重生成基线并回提 main（[skip ci]）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write  # [v5-fix] 手动基线刷新改走分支+PR（main 有分支保护，直推被拒 GH013）

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      # [AUDIT FIX 2026-09-17 B2-007] 与 ci.yml 统一按 SHA pin（本工作流持
      # contents: write 且可回提 main，供应链加固不能留缺口）。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 [pin]

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 [pin]

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 [pin]
        with:
          node-version: 22
          cache: pnpm

      # [AUDIT FIX 2026-09-17 B2-014] 恢复 frozen-lockfile：锁文件一致性必须在 CI 校验
      - run: pnpm install --ignore-scripts --frozen-lockfile --config.block-exotic-subdeps=false

      - name: Install Playwright chromium
        run: pnpm --filter @fidesorigin/web exec playwright install --with-deps chromium

      - name: Build web (static export)
        run: pnpm --filter @fidesorigin/web run build

      - name: Manual baseline refresh (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.update_snapshots == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd apps/web && pnpm exec playwright test --update-snapshots
          cd ../..
          git config user.name "visual-regression-bot"
          git config user.email "bot@fidesorigin.com"
          git add apps/web/test/visual/visual.spec.ts-snapshots/
          if git diff --cached --quiet; then
            echo "基线无变化，跳过提交"
            exit 0
          fi
          BRANCH="visual-baselines/refresh-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git commit -m "test(web): 视觉回归基线手动刷新（dispatch ${{ github.run_id }}）"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH"             --title "test(web): 视觉回归基线刷新（dispatch ${{ github.run_id }}）"             --body "workflow_dispatch 手动触发的基线重建。检查全绿后合并即可恢复对比模式。"


      - name: Bootstrap baselines (first run)
        id: bootstrap
        run: |
          if [ ! -d apps/web/test/visual/visual.spec.ts-snapshots ]; then
            if [ -z "${{ github.head_ref }}" ]; then
              echo "snapshots missing on main push — nothing to do (baselines land via PR)"
              echo "bootstrap=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
            cd apps/web && pnpm exec playwright test --update-snapshots
            cd ../..
            git config user.name "visual-regression-bot"
            git config user.email "bot@fidesorigin.com"
            git add apps/web/test/visual/visual.spec.ts-snapshots/
            git commit -m "test(web): 视觉回归基线自举 [skip ci]"
            BRANCH="${{ github.head_ref }}"
            git fetch origin "$BRANCH"
            # 构建可能改写已跟踪的自动生成文件（如 next-env.d.ts），rebase 前收拢
            git diff --quiet || git commit -am "chore: 收拢构建期生成文件 [skip ci]"
            git rebase "origin/$BRANCH"
            git push origin "HEAD:$BRANCH"
          else
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run visual comparison
        if: steps.bootstrap.outputs.bootstrap != 'true' && github.event.inputs.update_snapshots != 'true'
        run: |
          if [ ! -d apps/web/test/visual/visual.spec.ts-snapshots ]; then
            echo "::notice::快照基线尚未建立（首个 PR 正在自举）——本次跳过对比"
            exit 0
          fi
          cd apps/web && pnpm exec playwright test

      - name: Upload diff report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 [pin]
        with:
          name: visual-regression-report
          path: apps/web/test-results/
          retention-days: 7
