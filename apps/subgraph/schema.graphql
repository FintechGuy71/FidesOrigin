# FidesOrigin Protocol Subgraph Schema
# The Graph auto-generates Query fields for each @entity

type RiskProfile @entity(immutable: false) {
  id: ID!                              # 地址
  riskScore: BigInt!
  tier: RiskTier!
  tags: [String!]!
  lastUpdated: BigInt!
  isSanctioned: Boolean!
  sanctionedAt: BigInt
  sanctionReason: String
  updates: [RiskProfileUpdate!]! @derivedFrom(field: "account")
}

type RiskProfileUpdate @entity(immutable: false) {
  id: ID!                              # txHash-logIndex
  account: RiskProfile!
  riskScore: BigInt!
  tier: RiskTier!
  tags: [String!]!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: String!
  oracle: String!
}

type ComplianceCheck @entity(immutable: false) {
  id: ID!                              # txHash-logIndex
  operator: String! @index
  from: String! @index
  to: String! @index
  amount: BigInt!
  decision: Decision!
  reason: String!
  riskScore: BigInt
  checkType: String
  assetContract: String
  timestamp: BigInt! @index
  blockNumber: BigInt!
  transactionHash: String!
}

type Policy @entity(immutable: false) {
  id: ID!                              # issuer地址
  issuer: String! @index
  maxTxAmount: BigInt!
  dailyLimit: BigInt!
  allowMediumRisk: Boolean!
  allowHighRisk: Boolean!
  blockMixer: Boolean!
  requireDestinationKYC: Boolean!
  cooldownPeriod: BigInt!
  version: Int!
  updatedAt: BigInt! @index
  versions: [PolicyVersion!]! @derivedFrom(field: "policy")
}

type PolicyVersion @entity(immutable: false) {
  id: ID!                              # policyId-version
  policy: Policy!
  version: Int!
  maxTxAmount: BigInt!
  dailyLimit: BigInt!
  allowMediumRisk: Boolean!
  allowHighRisk: Boolean!
  blockMixer: Boolean!
  requireDestinationKYC: Boolean!
  cooldownPeriod: BigInt!
  updatedAt: BigInt!
  blockNumber: BigInt!
  transactionHash: String!
  active: Boolean!
}

# PolicyEvaluation entity for TransferEvaluated event
type PolicyEvaluation @entity(immutable: false) {
  id: ID!                              # txHash-logIndex
  policy: Policy
  operator: String! @index
  from: String! @index
  to: String! @index
  amount: BigInt!
  decision: Decision!
  reason: String!
  timestamp: BigInt! @index
  blockNumber: BigInt!
  transactionHash: String!
}

# WalletPolicy entity for WalletPolicySet event
type WalletPolicy @entity(immutable: false) {
  id: ID!                              # wallet address
  wallet: String! @index
  version: Int!
  maxTxValue: BigInt!
  maxTokenTxAmount: BigInt!
  dailyEthLimit: BigInt!
  dailyTokenLimit: BigInt!
  blockContractCalls: Boolean!
  blockUnknownTokens: Boolean!
  requireWhitelist: Boolean!
  allowedDex: [String!]!
  blockedContracts: [String!]!
  updatedAt: BigInt! @index
  blockNumber: BigInt!
  transactionHash: String!
}

type SanctionedAddress @entity(immutable: false) {
  id: ID!                              # 地址
  account: String! @index
  addedAt: BigInt! @index
  removedAt: BigInt
  isActive: Boolean! @index
  reason: String
  addedBy: String!
}

type HoldRecord @entity(immutable: false) {
  id: ID!                              # holdId
  owner: String! @index
  asset: String! @index
  amount: BigInt!
  timestamp: BigInt! @index
  reason: String!
  released: Boolean!
  releasedAt: BigInt
  releasedBy: String
}

type OperationLog @entity(immutable: false) {
  id: ID!                              # txHash-logIndex
  timestamp: BigInt! @index
  operator: String! @index
  operationType: String!
  result: String!
  details: String!
  blockNumber: BigInt!
  transactionHash: String!
}

type ProtocolStats @entity(immutable: false) {
  id: ID!                              # "stats"
  totalComplianceChecks: BigInt!
  totalAllowed: BigInt!                # 允许的交易数
  totalBlocked: BigInt!
  totalFlagged: BigInt!
  totalHeld: BigInt!
  totalSanctioned: Int!
  totalFundsHeld: BigInt!
  lastUpdated: BigInt!
}

# ========== Time Series Aggregation ==========

type DailyStats @entity(immutable: false) {
  id: ID!                              # YYYY-MM-DD
  date: String!                        # 2026-05-09
  totalChecks: BigInt!
  totalBlocked: BigInt!
  totalFlagged: BigInt!
  totalHeld: BigInt!
  uniqueAddresses: Int!                # derived from DailyStatsAddress count
  topDecision: String!                 # "ALLOW" | "BLOCK" | "FLAG" | "HOLD"
}

# NEW: Composite entity for unique address counting per day
type DailyStatsAddress @entity(immutable: false) {
  id: ID!                              # date-address
  date: String! @index
  address: String! @index
  firstSeen: BigInt!
}

type HourlyStats @entity(immutable: false) {
  id: ID!                              # YYYY-MM-DD-HH
  hour: String!                        # 2026-05-09-14
  totalChecks: BigInt!
  totalBlocked: BigInt!
  totalFlagged: BigInt!
  totalHeld: BigInt!
  txCount: BigInt!                     # 交易计数（替代TPS）
}

enum RiskTier {
  UNKNOWN
  LOW
  MEDIUM
  HIGH
  CRITICAL
}

enum Decision {
  ALLOW
  BLOCK
  FLAG
  HOLD
}

