specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: RiskRegistry
    network: sepolia
    source:
      abi: RiskRegistry
      address: "0x953f985f38f94d6159c0600d1f15D543895cE896"
      startBlock: 11550000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - RiskProfile
        - RiskProfileUpdate
        - SanctionedAddress
      abis:
        - name: RiskRegistry
          file: ./abis/RiskRegistry.json
      eventHandlers:
        # [AUDIT-FIX] RiskProfileUpdated 第二参实为 uint256（合约 RiskRegistry.sol L97-102），
        # 原签名 uint8 计算出的 topic0 与链上事件永不相等 → RiskProfile/SanctionedAddress
        # 实体自部署起零索引。
        - event: RiskProfileUpdated(indexed address,uint256,uint8,bool)
          handler: handleRiskProfileUpdated
        - event: AddressTagged(indexed address,indexed bytes32)
          handler: handleAddressTagged
        # [AUDIT-FIX] 删除 SanctionAdded / SanctionRemoved / ContractRegistered 订阅：
        # v3.1.0 合约已无这些事件（旧版残留），链上永远匹配不到。
      file: ./src/mappings/riskRegistry.ts
  - kind: ethereum
    name: ComplianceEngine
    network: sepolia
    source:
      abi: ComplianceEngine
      address: "0xdF36A8b16F064308eeDE21A740FAc4e87b724F0E"
      startBlock: 11550000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ComplianceCheck
        - HoldRecord
        - OperationLog
        - ProtocolStats
        - DailyStats
        - HourlyStats
        - DailyStatsAddress
      abis:
        - name: ComplianceEngine
          file: ./abis/ComplianceEngine.json
      eventHandlers:
        - event: ComplianceCheckPerformed(indexed address,indexed uint256,indexed bool,uint256,uint256,bytes32)
          handler: handleComplianceCheckPerformed
        - event: TransactionBlocked(indexed address,indexed address,indexed uint256,address,string,uint256,uint256)
          handler: handleTransactionBlocked
        - event: TransactionQuarantined(indexed address,indexed address,indexed uint256,address,bytes32,uint256,uint256)
          handler: handleTransactionQuarantined
        - event: QuarantineReleased(indexed bytes32,indexed address,uint256)
          handler: handleQuarantineReleased
        - event: RulePaused(indexed bytes32)
          handler: handleRulePaused
        - event: RuleUnpaused(indexed bytes32)
          handler: handleRuleUnpaused
      file: ./src/mappings/complianceEngine.ts
  - kind: ethereum
    name: PolicyEngine
    network: sepolia
    source:
      abi: PolicyEngine
      address: "0xCA12BB2daD2a6D429277823366D8C88a490EDDeA"
      startBlock: 11550000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Policy
        - PolicyVersion
        - PolicyEvaluation
        - WalletPolicy
      abis:
        - name: PolicyEngine
          file: ./abis/PolicyEngine.json
      eventHandlers:
        # [P1-3 FIX] 订阅签名对齐 v3.1.0 合约（原 tuple 形态/不存在的 PolicyEvaluated 永不触发，已实证零索引）
        - event: IssuerPolicySet(indexed address,uint256,uint256,bool,bool,uint256)
          handler: handleIssuerPolicySet
        - event: WalletPolicySet(indexed address)
          handler: handleWalletPolicySet
        - event: TransferEvaluated(indexed address,indexed address,uint256,uint8)
          handler: handleTransferEvaluated
        - event: RuleCreated(indexed bytes32,string,uint8)
          handler: handleRuleCreated
        - event: RuleUpdated(indexed bytes32,string,uint8)
          handler: handleRuleUpdated
        - event: RuleActivated(indexed bytes32)
          handler: handleRuleActivated
        - event: RuleDeactivated(indexed bytes32)
          handler: handleRuleDeactivated
      file: ./src/mappings/policyEngine.ts
  - kind: ethereum
    name: FidesCompliance
    network: sepolia
    source:
      abi: FidesCompliance
      address: "0x2625eA99A0E7D419b8051C4f2B3cC0b5d78d79D5"
      startBlock: 11550000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - RiskProfile
        - FidesComplianceCheck
        - FidesTransactionBlocked
        - FidesTransactionQuarantined
        - FidesAuditLog
        - FidesRule
      abis:
        - name: FidesCompliance
          file: ./abis/FidesCompliance.json
      eventHandlers:
        - event: TransactionChecked(indexed address,indexed address,indexed uint256,address,bool,uint256,uint256,uint256)
          handler: handleTransactionChecked
        - event: GuardCheck(indexed address,indexed address,uint8,uint256)
          handler: handleGuardCheck
        - event: TransactionBlocked(indexed address,indexed address,indexed uint256,address,string,uint256,uint256)
          handler: handleTransactionBlocked
        - event: TransactionQuarantined(indexed address,indexed address,indexed uint256,address,bytes32,uint256,uint256)
          handler: handleTransactionQuarantined
        - event: EmergencyModeActivated(uint256,uint256)
          handler: handleEmergencyModeActivated
        - event: EmergencyModeDeactivated(uint256,uint256)
          handler: handleEmergencyModeDeactivated
        - event: RoleGrantedDetailed(indexed bytes32,indexed address,indexed address,uint256,string)
          handler: handleRoleGrantedDetailed
        - event: RoleRevokedDetailed(indexed bytes32,indexed address,indexed address,uint256,string)
          handler: handleRoleRevokedDetailed
        - event: WhitelistUpdated(indexed address,bool,indexed address,uint256)
          handler: handleWhitelistUpdated
      file: ./src/mappings/fidesCompliance.ts
  - kind: ethereum
    name: CompliantStableCoin
    network: sepolia
    source:
      abi: CompliantStableCoin
      address: "0x2245A8FCf6aca017327eA8950Ba510e9596595E9"
      startBlock: 11550000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - TokenTransfer
        - TokenTransferBlocked
        - KYCStatus
        - TokenPolicy
      abis:
        - name: CompliantStableCoin
          file: ./abis/CompliantStableCoin.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
        - event: TransferBlocked(indexed address,indexed address,uint256,string)
          handler: handleTransferBlocked
        - event: KYCStatusUpdated(indexed address,bool)
          handler: handleKYCStatusUpdated
        - event: PolicyUpdated(indexed uint256,indexed uint256,bool,bool,bool,bool,uint256)
          handler: handlePolicyUpdated
      file: ./src/mappings/compliantStableCoin.ts
  - kind: ethereum
    name: QuarantineVault
    network: sepolia
    source:
      abi: QuarantineVault
      address: "0x6803E163259B07F58111f56423aB0732858196Be"
      startBlock: 11550000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - QuarantineRecord
        - QuarantineRelease
      abis:
        - name: QuarantineVault
          file: ./abis/QuarantineVault.json
      eventHandlers:
        - event: FundsFrozen(indexed bytes32,indexed address,address,uint256,indexed address,uint256)
          handler: handleFundsFrozen
        - event: FundsQuarantined(indexed bytes32,indexed address,address,uint256,string,uint256)
          handler: handleFundsQuarantined
        - event: FundsReleased(indexed bytes32,indexed address,address,uint256,address,uint256)
          handler: handleFundsReleased
        - event: ClaimDelayUpdated(uint256,uint256)
          handler: handleClaimDelayUpdated
      file: ./src/mappings/quarantineVault.ts
templates: []
