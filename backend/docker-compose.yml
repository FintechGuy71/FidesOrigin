version: '3.8'

# [P1 Fix] 数据库密码不再硬编码，通过 .env 文件或环境变量注入
# 使用方式: POSTGRES_PASSWORD=your_secure_password docker-compose up -d

services:
  api:
    build: .
    container_name: fidesorigin-api
    ports:
      - "8000:8000"
    environment:
      # [K3-Audit Fix] Force SSL for all database connections
      - DATABASE_URL=postgresql+asyncpg://fidesorigin:${POSTGRES_PASSWORD}@db:5432/fidesorigin?sslmode=require
      - DATABASE_URL_SYNC=postgresql://fidesorigin:${POSTGRES_PASSWORD}@db:5432/fidesorigin?sslmode=require
      # [K3-Audit Fix] Redis TLS — use rediss:// when TLS is enabled on Redis
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - DEBUG=${DEBUG:-false}
      - BLOCKSCOUT_API_KEY=${BLOCKSCOUT_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
#       - ./app:/app/app
    # [MEDIUM-8 FIX] Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - fidesorigin-network
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: fidesorigin-db
    # [K3-Audit Fix] Enable SSL on PostgreSQL
    # For production, mount SSL certs and set: ssl=on, ssl_cert_file, ssl_key_file
    # See: https://www.postgresql.org/docs/current/ssl-tcp.html
    environment:
      - POSTGRES_USER=fidesorigin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=fidesorigin
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # [MEDIUM-8 FIX] Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - fidesorigin-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fidesorigin -d fidesorigin"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fidesorigin-redis
    # [K3-Audit Fix] Enable Redis TLS for production
    # Mount redis.conf with: tls-port 6379, port 0, tls-cert-file, tls-key-file, tls-ca-cert-file
    # See: https://redis.io/docs/latest/operate/oss_and_stack/management/security/encryption/
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    # [MEDIUM-8 FIX] Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks:
      - fidesorigin-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build: .
    container_name: fidesorigin-worker
    command: celery -A app.services.celery_app worker --loglevel=info
    environment:
      # [K3-Audit Fix] Force SSL for all database connections
      - DATABASE_URL=postgresql+asyncpg://fidesorigin:${POSTGRES_PASSWORD}@db:5432/fidesorigin?sslmode=require
      - DATABASE_URL_SYNC=postgresql://fidesorigin:${POSTGRES_PASSWORD}@db:5432/fidesorigin?sslmode=require
      # [K3-Audit Fix] Redis TLS — use rediss:// when TLS is enabled on Redis
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - BLOCKSCOUT_API_KEY=${BLOCKSCOUT_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
#       - ./app:/app/app
    # [MEDIUM-8 FIX] Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - fidesorigin-network
    restart: unless-stopped

  migration:
    build: .
    container_name: fidesorigin-migration
    command: alembic upgrade head
    environment:
      # [K3-Audit Fix] Force SSL for database connections
      - DATABASE_URL_SYNC=postgresql://fidesorigin:${POSTGRES_PASSWORD}@db:5432/fidesorigin?sslmode=require
    depends_on:
      db:
        condition: service_healthy
    # [MEDIUM-8 FIX] Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks:
      - fidesorigin-network
    profiles:
      - migration

volumes:
  postgres_data:
  redis_data:

networks:
  fidesorigin-network:
    driver: bridge
