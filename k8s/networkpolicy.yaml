# [K3-Audit Fix] NetworkPolicy: restrict outbound connections to only required endpoints
# Apply this to the fidesorigin-data-publisher namespace.
#
# ⚠️  SECURITY WARNING: Standard Kubernetes NetworkPolicy does NOT support FQDN-based
#    filtering. The standard policy below CANNOT restrict egress to specific external
#    domains. For production, you MUST use one of:
#      1. CiliumNetworkPolicy  → see k8s/networkpolicy-cilium.yaml (RECOMMENDED)
#      2. Calico NetworkPolicy → supports domain-based rules
#      3. Istio Egress Gateway → route all external traffic through a controlled gateway
#
#    The standard policy below is a MINIMAL fallback that:
#      - Allows internal cluster communication (DNS, Redis, monitoring)
#      - DENIES all external HTTPS egress by default
#    If you deploy WITHOUT Cilium/Calico/Istio, you MUST add explicit ipBlock rules
#    for each known endpoint IP, or external API calls will fail.
#
# Required external domains (FQDN) for this workload:
#   - treasury.gov          (OFAC SDN list)
#   - api.chainalysis.com   (Chainalysis risk data)
#   - api.opensanctions.org (OpenSanctions data)
#   - api.etherscan.io      (Etherscan API)
#   - thegraph.com          (Subgraph gateway)
#   - *.alchemy.com         (Alchemy RPC)
#   - raw.githubusercontent.com (Metamask phishing list)
#
# ── Fallback: explicit ipBlock example (uncomment and fill in known IPs) ──
#   - to:
#       - ipBlock:
#           cidr: 104.18.XXX.0/24   # treasury.gov CDN
#       - ipBlock:
#           cidr: 52.84.XXX.0/24    # api.chainalysis.com
#     ports:
#       - protocol: TCP
#         port: 443
# ───────────────────────────────────────────────────────────────────────────

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fidesorigin-publisher-netpol
  namespace: fidesorigin
  labels:
    app: fidesorigin-data-publisher
  annotations:
    fidesorigin.io/policy-type: "standard-fallback"
    fidesorigin.io/warning: "Standard NetworkPolicy cannot filter external HTTPS by FQDN. Use networkpolicy-cilium.yaml for production."
spec:
  podSelector:
    matchLabels:
      app: fidesorigin-data-publisher
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow metrics scraping from monitoring (e.g., Prometheus)
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 9090
  egress:
    # Allow DNS resolution (kube-dns in any namespace)
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # [K3-Audit Fix] External HTTPS is DENIED by default in standard K8s.
    # Use CiliumNetworkPolicy (networkpolicy-cilium.yaml) for FQDN-based egress.
    # If you must use standard NetworkPolicy, uncomment the ipBlock section above
    # and list every known endpoint CIDR.
    #
    # REMOVED: blanket "to: []" allow on port 443 — this permitted egress to ANY host.
    #
    # Allow internal Redis communication (if cluster mode enabled)
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
