# [High Fix #55] K8s RBAC — least-privilege role for fidesorigin-data-publisher
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fidesorigin-publisher-role
  namespace: fidesorigin
  labels:
    app: fidesorigin-data-publisher
rules:
  # Allow reading own configmaps
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Allow reading specific secrets only (least privilege)
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - "fidesorigin-publisher-keys"
      - "fidesorigin-cloud-keys"
      - "fidesorigin-vault-keys"
    verbs: ["get"]
  # Allow updating own configmaps (for leader election / coordination)
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["fidesorigin-publisher-leader"]
    verbs: ["update", "patch"]
  # Allow reading pods (for self-monitoring)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
