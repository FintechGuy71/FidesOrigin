# [High Fix #55] K8s RBAC — bind role to fidesorigin-publisher service account
# NOTE: The service account name MUST match the serviceAccountName used in
# deployment.yaml and cronjob.yaml (both reference "fidesorigin-publisher").
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fidesorigin-publisher-rolebinding
  namespace: fidesorigin
  labels:
    app: fidesorigin-data-publisher
subjects:
  - kind: ServiceAccount
    name: fidesorigin-publisher
    namespace: fidesorigin
roleRef:
  kind: Role
  name: fidesorigin-publisher-role
  apiGroup: rbac.authorization.k8s.io
