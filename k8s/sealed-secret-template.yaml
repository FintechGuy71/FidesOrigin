# [Sec-Fix] SealedSecret templates — safe to commit to Git
# ============================================================
# What is Sealed Secrets?
#   Sealed Secrets (bitnami-labs/sealed-secrets) lets you encrypt a Kubernetes
#   Secret into a SealedSecret CRD. The sealed version is safe to store in Git
#   because only the cluster's sealed-secrets controller can decrypt it.
#
# How to use:
#   1. Install the controller in your cluster:
#        kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.24.5/controller.yaml
#
#   2. Install kubeseal CLI (macOS example):
#        brew install kubeseal
#
#   3. Create raw Secret YAMLs (one per secret below), fill in the values
#      in a secure environment (never commit the raw Secret):
#        cat <<EOF > raw-publisher-keys.yaml
#        apiVersion: v1
#        kind: Secret
#        metadata:
#          name: fidesorigin-publisher-keys
#          namespace: fidesorigin
#        type: Opaque
#        stringData:
#          publisher-private-key: "0x..."
#          fatf-oracle-private-key: "0x..."
#        EOF
#
#        cat <<EOF > raw-cloud-keys.yaml
#        apiVersion: v1
#        kind: Secret
#        metadata:
#          name: fidesorigin-cloud-keys
#          namespace: fidesorigin
#        type: Opaque
#        stringData:
#          aws-access-key-id: "AKIA..."
#          aws-secret-access-key: "..."
#        EOF
#
#        cat <<EOF > raw-vault-keys.yaml
#        apiVersion: v1
#        kind: Secret
#        metadata:
#          name: fidesorigin-vault-keys
#          namespace: fidesorigin
#        type: Opaque
#        stringData:
#          vault-token: "hvs."
#        EOF
#
#   4. Encrypt with kubeseal (this produces the files below):
#        kubeseal --controller-namespace=kube-system \
#                 --controller-name=sealed-secrets \
#                 --format yaml < raw-publisher-keys.yaml > k8s/sealed-secret-publisher.yaml
#        kubeseal --controller-namespace=kube-system \
#                 --controller-name=sealed-secrets \
#                 --format yaml < raw-cloud-keys.yaml > k8s/sealed-secret-cloud.yaml
#        kubeseal --controller-namespace=kube-system \
#                 --controller-name=sealed-secrets \
#                 --format yaml < raw-vault-keys.yaml > k8s/sealed-secret-vault.yaml
#
#   5. Delete the raw secrets immediately:
#        rm -f raw-*.yaml
#
#   6. Commit ONLY the sealed-secret-*.yaml files to Git.
#
#   7. Apply to cluster (the controller auto-decrypts to regular Secrets):
#        kubectl apply -f k8s/sealed-secret-publisher.yaml
#        kubectl apply -f k8s/sealed-secret-cloud.yaml
#        kubectl apply -f k8s/sealed-secret-vault.yaml
#
# Scope & Rotation:
#   - Each SealedSecret is namespace-scoped. If you move it to another namespace,
#     you must re-encrypt it with --scope cluster-wide or --scope namespace-wide.
#   - To rotate secrets, re-run kubeseal with new values and re-apply.
# ============================================================

# ── SealedSecret 1: Publisher keys (EVM private keys) ────────────────────
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: fidesorigin-publisher-keys
  namespace: fidesorigin
  annotations:
    sealedsecrets.bitnami.com/managed: "true"
spec:
  encryptedData:
    # Replace with actual kubeseal output:
    # publisher-private-key: AgByA...encrypted...==
    # fatf-oracle-private-key: AgByA...encrypted...==
  template:
    metadata:
      name: fidesorigin-publisher-keys
      namespace: fidesorigin
      labels:
        app: fidesorigin-data-publisher
    type: Opaque

---
# ── SealedSecret 2: Cloud provider keys (AWS IAM) ────────────────────────
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: fidesorigin-cloud-keys
  namespace: fidesorigin
  annotations:
    sealedsecrets.bitnami.com/managed: "true"
spec:
  encryptedData:
    # Replace with actual kubeseal output:
    # aws-access-key-id: AgByA...encrypted...==
    # aws-secret-access-key: AgByA...encrypted...==
  template:
    metadata:
      name: fidesorigin-cloud-keys
      namespace: fidesorigin
      labels:
        app: fidesorigin-data-publisher
    type: Opaque

---
# ── SealedSecret 3: Vault token (HashiCorp Vault) ────────────────────────
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: fidesorigin-vault-keys
  namespace: fidesorigin
  annotations:
    sealedsecrets.bitnami.com/managed: "true"
spec:
  encryptedData:
    # Replace with actual kubeseal output:
    # vault-token: AgByA...encrypted...==
  template:
    metadata:
      name: fidesorigin-vault-keys
      namespace: fidesorigin
      labels:
        app: fidesorigin-data-publisher
    type: Opaque
