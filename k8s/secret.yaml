apiVersion: v1
kind: Secret
metadata:
  name: fidesorigin-keys
  namespace: fidesorigin
  labels:
    app: fidesorigin-data-publisher
    # [Sec-Fix] Mark this as a template so admission controllers can reject
    # raw secrets in production if desired.
    fidesorigin.io/secret-type: template
type: Opaque
# stringData is commented out intentionally. To create a real Secret locally:
#   kubectl create secret generic fidesorigin-keys \
#     --from-literal=publisher-private-key="0x..." \
#     --from-literal=fatf-oracle-private-key="0x..." \
#     --from-literal=aws-access-key-id="" \
#     --from-literal=aws-secret-access-key="" \
#     --from-literal=vault-token="" \
#     -n fidesorigin
# stringData:
#   # Option A: Plain private key (base64-encoded when applied via kubectl)
#   # Replace with: echo -n '0x...' | base64
#   publisher-private-key: ""
#
#   # Option B: AWS KMS credentials (if using KMS)
#   aws-access-key-id: ""
#   aws-secret-access-key: ""
#
#   # Option C: HashiCorp Vault token (if using Vault)
#   vault-token: ""
#
#   # FATF Oracle private key (separate ORACLE_ROLE deployer)
#   fatf-oracle-private-key: ""
