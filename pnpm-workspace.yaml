packages:
  - "apps/*"
  - "packages/*"

# pnpm v11.6 唯一生效的构建审批配置（onlyBuiltDependencies 已废弃并移除）。
# true = 允许构建；false = 显式拒绝（避免 ERR_PNPM_IGNORED_BUILDS 使
# plain pnpm install 退出 1）。以下原生构建本仓库并不需要——CI 与
# website 生产均以 --ignore-scripts 全跳过运行，二进制随包预置。
allowBuilds:
  msw: true
  "@arbitrum/nitro-contracts": false
  esbuild: false
  keccak: false
  protobufjs: false
  secp256k1: false
  sharp: false
  unrs-resolver: false

overrides:
  "@chainlink/contracts": "1.3.0"

settings:
  fetchTimeout: 600000
  networkConcurrency: 3
