<script>
// Language Switcher
function toggleLangDropdown(dropdownId, btnId) {
  var dd = document.getElementById(dropdownId);
  var btn = document.getElementById(btnId);
  if (!dd || !btn) return;
  var isOpen = dd.classList.contains('open');
  document.querySelectorAll('.lang-switch-dropdown').forEach(function(d){ d.classList.remove('open'); });
  document.querySelectorAll('.lang-switch-btn').forEach(function(b){ b.classList.remove('active'); });
  if (!isOpen) {
    dd.classList.add('open');
    btn.classList.add('active');
  }
}
document.addEventListener('click', function(e) {
  if (!e.target.closest('.lang-switch')) {
    document.querySelectorAll('.lang-switch-dropdown').forEach(function(d){ d.classList.remove('open'); });
    document.querySelectorAll('.lang-switch-btn').forEach(function(b){ b.classList.remove('active'); });
  }
});
</script>
